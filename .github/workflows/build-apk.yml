name: Build QuantFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip'
      - 'dashboard_v2.html.gz.b64'
      - 'mobile_app_v2.py.gz.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip' | sort | head -1)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          PROJECT_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dashboard and analytics update
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dashboard_v2.html.gz.b64 | gzip -dc > "$PROJECT_DIR/app/src/main/assets/bot_seed/index.html"
          base64 -d mobile_app_v2.py.gz.b64 | gzip -dc > "$PROJECT_DIR/app/src/main/python/mobile_app.py"
          python3 -m py_compile "$PROJECT_DIR/app/src/main/python/mobile_app.py"
          grep -q 'Tage im Vergleich' "$PROJECT_DIR/app/src/main/assets/bot_seed/index.html"
          grep -q 'daily_history' "$PROJECT_DIR/app/src/main/python/mobile_app.py"
          sed -i "s/versionCode 2/versionCode 3/" "$PROJECT_DIR/app/build.gradle"
          sed -i "s/versionName '8.18.2-forward-onetap-2'/versionName '8.18.2-dashboard-pro-3'/" "$PROJECT_DIR/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find buildsrc -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -1)"
          test -n "$APK"
          cp "$APK" QuantFlow-V8.18.2-DashboardPro.apk
          sha256sum QuantFlow-V8.18.2-DashboardPro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantFlow-V8.18.2-DashboardPro-APK
          path: QuantFlow-V8.18.2-DashboardPro.apk
          if-no-files-found: error
