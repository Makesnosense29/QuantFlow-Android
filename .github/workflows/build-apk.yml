name: Build QuantFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QuantFlow_V8_18_2_OneTap_Android_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f QuantFlow_V8_18_2_OneTap_Android_Project.zip
          sha256sum QuantFlow_V8_18_2_OneTap_Android_Project.zip

      - name: Extract Android project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q QuantFlow_V8_18_2_OneTap_Android_Project.zip -d buildsrc
          find buildsrc -maxdepth 2 -type f | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK="$(find buildsrc -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -1)"
          test -n "$APK"
          cp "$APK" QuantFlow-V8.18.2-forward.apk
          sha256sum QuantFlow-V8.18.2-forward.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantFlow-V8.18.2-forward-APK
          path: QuantFlow-V8.18.2-forward.apk
          if-no-files-found: error
