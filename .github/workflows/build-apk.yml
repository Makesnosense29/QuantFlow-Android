name: Build QuantFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip' | sort | head -1)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          find buildsrc -maxdepth 3 -type f | head -80

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find buildsrc -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -1)"
          test -n "$APK"
          cp "$APK" QuantFlow-V8.18.2-forward.apk
          sha256sum QuantFlow-V8.18.2-forward.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantFlow-V8.18.2-forward-APK
          path: QuantFlow-V8.18.2-forward.apk
          if-no-files-found: error
