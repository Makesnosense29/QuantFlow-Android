name: Build QuantFlow V8.18.5 Adaptive Quality PAPER APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip'
      - 'dashboard_v2.html.gz.b64'
      - 'mobile_app_v2.py.gz.b64'
      - 'bot_v8184.part*.txt'
      - 'config_v8184.json.gz.b64'
      - 'v8185_patch.py'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'QuantFlow_V8_18_2_OneTap_Android_Project*.zip' | sort | head -1)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          PROJECT_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install V8.18.5 runtime
        shell: bash
        run: |
          set -euo pipefail

          base64 -d dashboard_v2.html.gz.b64 | gzip -dc > "$PROJECT_DIR/app/src/main/assets/bot_seed/index.html"
          base64 -d mobile_app_v2.py.gz.b64 | gzip -dc > "$PROJECT_DIR/app/src/main/python/mobile_app.py"
          cat bot_v8184.part*.txt | tr -d '\r\n ' | base64 -d | gzip -dc > "$PROJECT_DIR/app/src/main/python/bot.py"
          base64 -d config_v8184.json.gz.b64 | gzip -dc > "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          python3 v8185_patch.py "$PROJECT_DIR"

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(sys.argv[1])
          gradle_path = root / "app/build.gradle"
          main_path = root / "app/src/main/java/de/quantflow/v8182paper/MainActivity.java"
          service_path = root / "app/src/main/java/de/quantflow/v8182paper/BotService.java"

          gradle = gradle_path.read_text(encoding="utf-8")
          gradle = re.sub(r"versionCode\s+\d+", "versionCode 7", gradle, count=1)
          gradle = re.sub(r"versionName\s+'[^']+'", "versionName '8.18.5-adaptive-quality-7'", gradle, count=1)
          if "release {" in gradle and "debuggable true" not in gradle:
              gradle = gradle.replace(
                  "release {\n            minifyEnabled false",
                  "release {\n            debuggable true\n            minifyEnabled false"
              )
          gradle_path.write_text(gradle, encoding="utf-8")

          main = main_path.read_text(encoding="utf-8")
          main = main.replace("V8.18.2-forward · PAPER only", "V8.18.5-adaptive-quality · PAPER only")
          main_path.write_text(main, encoding="utf-8")

          service = service_path.read_text(encoding="utf-8")
          service = service.replace("V8.18.2-forward startet …", "V8.18.5-adaptive-quality startet …")
          service = service.replace("V8.18.2-forward läuft · PAPER only", "V8.18.5-adaptive-quality läuft · PAPER only")

          # Runtime config must survive app/service restarts; HTML/JS/CSS may still be reseeded.
          service = service.replace(
              'boolean immutable = out.getName().equals("config.json") || out.getName().endsWith(".html") ||',
              'boolean immutable = out.getName().endsWith(".html") ||'
          )
          service_path.write_text(service, encoding="utf-8")
          PY

      - name: Verify Python and configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "07bb64ac13019d68d5f6608d0ae4c28e204965b1d9fcfb847a306309bd5eadb8  $PROJECT_DIR/app/src/main/python/bot.py" | sha256sum -c -
          echo "cafd6f3001e55225750c70e38f79ba6be6140a328af96fa3703d0007fac0900a  $PROJECT_DIR/app/src/main/assets/bot_seed/config.json" | sha256sum -c -
                    python3 -m py_compile "$PROJECT_DIR/app/src/main/python/bot.py"
          python3 -m py_compile "$PROJECT_DIR/app/src/main/python/mobile_app.py"
          grep -q 'def adaptive_stop_update' "$PROJECT_DIR/app/src/main/python/bot.py"
          grep -q 'def short_flow_ok' "$PROJECT_DIR/app/src/main/python/bot.py"
          grep -q 'position_paths.jsonl' "$PROJECT_DIR/app/src/main/python/bot.py"
          grep -q 'entry_ai_active' "$PROJECT_DIR/app/src/main/python/bot.py"
          grep -q 'AI_STOP' "$PROJECT_DIR/app/src/main/python/bot.py"
          grep -q '"version": "V8.18.5-adaptive-quality"' "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          grep -q '"max_trades_per_day": 999999999' "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          grep -q '"max_daily_loss_eur": 999999999.0' "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          grep -q '"loss_pause_count": 2' "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          grep -q '"scan_interval_seconds": 2' "$PROJECT_DIR/app/src/main/assets/bot_seed/config.json"
          grep -q 'Tage im Vergleich' "$PROJECT_DIR/app/src/main/assets/bot_seed/index.html"
          grep -q 'daily_history' "$PROJECT_DIR/app/src/main/python/mobile_app.py"

          BOT_TEST_MODE=1           BOT_DATA_DIR="$PROJECT_DIR/app/src/main/assets/bot_seed"           PYTHONPATH="$PROJECT_DIR/app/src/main/python"           python3 - <<'PY'
          import bot
          bot.validate_config()
          assert bot.CONFIG["loss_pause_count"] >= 2
          assert bot.CONFIG["paper_unlimited_testing"] is True
          assert bot.CONFIG["adaptive_stop_enabled"] is True
          assert bot.CONFIG["max_drawdown_pct"] == 99.0
          assert bot.CONFIG["entry_confirmations"] == 4
          assert bot.CONFIG["confirmation_min_price_move_pct"] == 0.05
          assert bot.CONFIG["fast_v812"]["quick_take_net_pct"] == 4.0
          assert bot.CONFIG["entry_quality_v818"]["min_m5_buys"] == 3
          print("V8.18.5 validation OK")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find buildsrc -path '*/app/build/outputs/apk/release/app-release-unsigned.apk' | head -1)"
          test -n "$APK"
          cp "$APK" QuantFlow-V8.18.5-Adaptive-Quality-PAPER-unsigned.apk
          sha256sum QuantFlow-V8.18.5-Adaptive-Quality-PAPER-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantFlow-V8.18.5-Adaptive-Quality-PAPER-Unsigned-APK
          path: QuantFlow-V8.18.5-Adaptive-Quality-PAPER-unsigned.apk
          if-no-files-found: error
